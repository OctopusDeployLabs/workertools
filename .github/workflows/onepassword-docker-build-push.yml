name: Build onepassword-workertools image

on:
  push:
    branches:
    - main
    paths:
    - onepassword/**
    - .github/workflows/onepassword-docker-build-push.yml
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force the build to run'
        required: false
        default: false
        type: boolean

env:
   REGISTRY_IMAGE_BASE: octopuslabs/workertools
   REGISTRY_IMAGE: octopuslabs/onepassword-workertools

jobs:

  get-version-number:
    runs-on: windows-latest
    outputs:
      CONTINUE: ${{ steps.check-version.outputs.CONTINUE }}
      VERSION: ${{ steps.check-version.outputs.VERSION }}
      DEB_VERSION: ${{ steps.check-version.outputs.DEB_VERSION }}
    steps:
    - uses: actions/checkout@v7
    - id: check-version
      name: Compare latest version with container
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $forceRun = "${{ github.event.inputs.force_run }}" -eq "true"
        Write-Host "Getting latest 1Password CLI version from the apt repository"
        $httpClient = [System.Net.Http.HttpClient]::new()
        $versionsByArch = foreach ($arch in @("amd64", "arm64")) {
            $packagesUrl = "https://downloads.1password.com/linux/debian/$arch/dists/stable/main/binary-$arch/Packages"
            $packages = $httpClient.GetStringAsync($packagesUrl).GetAwaiter().GetResult()
            $archVersions = @($packages -split "\r?\n\r?\n" |
                Where-Object { $_ -match "(?m)^Package: 1password-cli$" } |
                ForEach-Object { if ($_ -match "(?m)^Version: (\S+)$") { $Matches[1] } })
            if ($archVersions.Count -eq 0) {
                throw "No 1password-cli packages found for $arch in the apt repository!"
            }
            ,$archVersions
        }

        # Only consider versions published for every platform we build
        $commonVersions = @($versionsByArch[0] | Where-Object { $versionsByArch[1] -contains $_ })
        $latestDebVersion = $commonVersions |
            Where-Object { $_ -match "^\d+\.\d+\.\d+-\d+$" } |
            Sort-Object { [System.Version]($_ -replace "-", ".") } |
            Select-Object -Last 1
        Write-Host "Latest 1password-cli apt package version: $latestDebVersion"
        $latestOpVersion = $latestDebVersion -replace "-\d+$", ""

        [System.Version]$version = $null
        $versionParsed = [System.Version]::TryParse($latestOpVersion, [ref]$version)
        if(-not $versionParsed) {
            Write-Host "Unable to parse '$latestOpVersion' as a valid version. Won't continue"
            echo "CONTINUE=No" >> $env:GITHUB_OUTPUT
        }
        else {
            $versionToCompare = "$($version.Major).$($version.Minor).$($version.Build)"
            Write-Host "Parsed version as $versionToCompare"

            $workerToolsTags = (Invoke-RestMethod "https://registry.hub.docker.com/v2/repositories/${{ env.REGISTRY_IMAGE }}/tags?page_size=50")
            $matchingTag = $workerToolsTags.results | Where-Object { $_.name -eq $versionToCompare }

            echo "VERSION=$versionToCompare" >> $env:GITHUB_OUTPUT
            echo "DEB_VERSION=$latestDebVersion" >> $env:GITHUB_OUTPUT

            $isUpgradeNeeded = $null -eq $matchingTag

            if ($forceRun -or $isUpgradeNeeded)
            {
                if ($forceRun) {
                    Write-Host "Manual trigger is set. Forcing a build."
                }
                Write-Host "We need to upgrade the onepassword container to $versionToCompare"
                Write-Host "We have everything we need, continuing."
                echo "CONTINUE=Yes" >> $env:GITHUB_OUTPUT
            }
            else
            {
                Write-Host "Docker container already has the latest version of the 1Password CLI"
                echo "CONTINUE=No" >> $env:GITHUB_OUTPUT
            }
        }
      shell: pwsh
  build-linux:
    needs: [get-version-number]
    if: ${{ needs.get-version-number.outputs.CONTINUE == 'Yes' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      VERSION_NUMBER: ${{ needs.get-version-number.outputs.VERSION }}
      DEB_VERSION: ${{ needs.get-version-number.outputs.DEB_VERSION }}
    steps:

    - name: Prepare
      run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "PLATFORM_ARCH=${platform//[linux\/]/}" >> $GITHUB_ENV

    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PAT }}

    - name: Build and push image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: onepassword/${{ env.PLATFORM_PAIR }}
        platforms: ${{ matrix.platform }}
        provenance: false
        build-args: |
          BASE_IMAGE=${{ env.REGISTRY_IMAGE_BASE }}
          OP_VERSION=${{ env.DEB_VERSION }}
        outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ env.REGISTRY_IMAGE }}-${{ github.job }}-${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,mode=max,scope=${{ env.REGISTRY_IMAGE }}-${{ github.job }}-${{ env.PLATFORM_PAIR }}

    - name: Export digest
      run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
  merge:
    needs: [get-version-number, build-linux]
    if: ${{ needs.get-version-number.outputs.CONTINUE == 'Yes' }}
    runs-on: ubuntu-latest
    env:
      VERSION_NUMBER: ${{ needs.get-version-number.outputs.VERSION }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            ${{ env.VERSION_NUMBER }}
            latest
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}